name: Update Weather Data

on:
  schedule:
    - cron: '41 6,9,12 * * *' # Run at specific hours
  workflow_dispatch: # Manual trigger
  push:
    branches:
      - main
    paths:
      - 'generate_data.py'

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      # Updated to v5 to resolve Node.js 20 deprecation
      - name: Checkout repository
        uses: actions/checkout@v5

      # Updated to v6 to resolve Node.js 20 deprecation
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip' # Cache pip dependencies

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install supabase pywebpush

      # Run data generation script; requires 'requests' (in requirements.txt)
      - name: Run data generation script
        env:
          METEOSERVER_API_KEY: ${{ secrets.METEOSERVER_API_KEY }}
        run: python generate_data.py

      - name: Send THI notifications
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: mailto:demo@example.com
        run: python send_notification.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs/data/*.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update weather data [skip ci]"
          git push
